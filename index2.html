<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.15.1/devicon.min.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .font-serif-heading {
            font-family: 'Playfair Display', serif;
        }
    </style>

<body
    class="bg-black text-white min-h-screen flex flex-col justify-between selection:bg-yellow-500 selection:text-black">

    <!-- Header / Navbar -->
    <header class="w-full max-w-7xl mx-auto px-12 py-8 flex justify-between items-center">

        <div class="text-2xl font-bold flex items-center tracking-wide">
            <span class="text-emerald-400 font-extrabold mr-1">&gt;_</span>Thanaporn SAU

        <nav class="flex items-center space-x-10 text-sm font-medium">
            <a href="#" class="text-yellow-400 hover:text-yellow-300 transition">Home</a>
            <a href="#" class="text-gray-300 hover:text-white transition">About</a>
            <a href="#" class="text-gray-300 hover:text-white transition">Portfolio</a>
            <a href="#"

        <div class="max-w-lg space-y-6">

            <p class="text-gray-300 text-sm font-light leading-relaxed">

                <a href="#" class="text-white text-3xl hover:text-gray-300 transition-colors">
                    <i class="fab fa-github"></i>

        </div>

        <!-- Right Side: Profile Image -->
        <div class="relative">
            <div class="w-[360px] h-[360px] rounded-full overflow-hidden border-2 border-transparent ">

                <img src="images/ai2.jpg" alt="Profile Picture" class="w-full h-full object-cover">

    <section class="mt-12 w-full flex flex-col items-center justify-center text-center">

            <!-- 3. JavaScript -->

            <!-- 4. Node.js -->
            <img src="images/b4.png" alt="app Picture">

            <!-- 5. React -->
            <img src="images/b5.png" alt="app Picture">

            <!-- 6. Spring Boot -->
            <img src="images/b6.png" alt="app Picture">

            <!-- 7. Java -->
            <img src="images/b7.png" alt="app Picture">

            <!-- 8. Figma -->
